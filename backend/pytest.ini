[pytest]
asyncio_mode = auto
testpaths = tests
log_cli = true
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

[coverage:run]
source = app
omit =
    app/tests/*
    alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
