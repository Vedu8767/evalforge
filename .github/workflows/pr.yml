name: PR Validation

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  # ── Quick validation on every PR ─────────────────────────────────────────────
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: evalforge_test
          POSTGRES_DB: evalforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Backend — install deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Backend — run migrations
        working-directory: backend
        env:
          DATABASE_URL_SYNC: postgresql://evalforge:evalforge_test@localhost:5432/evalforge_test
          JWT_SECRET: test
          ENCRYPTION_KEY: test-encryption-key-32-bytesXXX!!
        run: alembic upgrade head

      - name: Backend — run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://evalforge:evalforge_test@localhost:5432/evalforge_test
          DATABASE_URL_SYNC: postgresql://evalforge:evalforge_test@localhost:5432/evalforge_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-not-for-production-64-chars-padded-0000
          ENCRYPTION_KEY: test-encryption-key-32-bytesXXX!!
          OPENAI_API_KEY: sk-test-not-real
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Frontend — install deps
        working-directory: frontend
        run: npm ci

      - name: Frontend — type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend — build check
        working-directory: frontend
        env:
          NEXTAUTH_URL: https://evalforge.vercel.app
          NEXTAUTH_SECRET: build-secret-not-real
          NEXT_PUBLIC_API_URL: https://evalforge-api.railway.app
        run: npm run build

      - name: Post PR summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} **PR Validation ${status}**\n\n` +
                    `- Backend tests: ${{ steps.backend-tests.outcome || 'ran' }}\n` +
                    `- Frontend build: ${{ steps.frontend-build.outcome || 'ran' }}\n` +
                    `- [View full run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
